on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Hadolint
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: Dockerfile

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies and run ESLint
        run: |
          npm ci
          npx eslint .

  build:
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Cache npm dependencies
        id: npm-cache
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-npm-

      - name: Install dependencies
        run: |
          npm ci
          npm test -- --json --outputFile=test-results.json

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: test-results.json

      - name: Show cache hit status
        run: echo "Cache hit was ${{ steps.npm-cache.outputs.cache-hit }}"

      - name: Test secret masking
        env:
          TEST_SECRET: ${{ secrets.TEST_SECRET }}
        run: |
          echo "Trying to print the secret directly:"
          echo "$TEST_SECRET"
          echo "Secret length check (safe, no leak):"
          echo "Length is ${#TEST_SECRET} characters"
      - name: Build Docker image
        run: docker build -t my-app:v1 .