name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Cache npm dependencies
        id: npm-cache
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-npm-

      - name: Install dependencies
        run: |
          npm ci
          npm eslint .
          npm test

      - name: Show cache hit status
        run: echo "Cache hit was ${{ steps.npm-cache.outputs.cache-hit }}"
      - name: Test secret masking
        env:
          TEST_SECRET: ${{ secrets.TEST_SECRET }}
        run: |
          echo "Trying to print the secret directly:"
          echo "$TEST_SECRET"
          echo "Secret length check (safe, no leak):"
          echo "Length is ${#TEST_SECRET} characters"
          echo "Reversed: $(echo $TEST_SECRET | rev)"
