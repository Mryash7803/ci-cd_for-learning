name: Kyverno and Cosign Security Checks

on:
  push:
  pull_request:

permissions:
  contents: read
  id-token: write

jobs:
  policy-and-signature-checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Kyverno CLI
        uses: kyverno/action-install-cli@v0.2.0

      - name: Install Cosign
        uses: sigstore/cosign-installer@v3.7.0

      - name: Run Kyverno Test Suite and Cosign Verification
        shell: bash
        run: |
          set -euo pipefail

          # 1. Create clean workspace
          mkdir -p security-suite
          cd security-suite

          # 2. Create the 3 Kyverno policies
          cat > policies.yaml <<'EOF'
          apiVersion: kyverno.io/v1
          kind: ClusterPolicy
          metadata:
            name: disallow-privileged
          spec:
            validationFailureAction: Enforce
            rules:
              - name: privileged-containers
                match:
                  any:
                    - resources:
                        kinds: [Pod]
                validate:
                  message: "Privileged containers are not allowed."
                  pattern:
                    spec:
                      containers:
                        - =(securityContext):
                            =(privileged): false
          ---
          apiVersion: kyverno.io/v1
          kind: ClusterPolicy
          metadata:
            name: require-owner-label
          spec:
            validationFailureAction: Enforce
            rules:
              - name: owner-label
                match:
                  any:
                    - resources:
                        kinds: [Pod]
                validate:
                  message: "The owner label is required."
                  pattern:
                    metadata:
                      labels:
                        owner: "?*"
          ---
          apiVersion: kyverno.io/v1
          kind: ClusterPolicy
          metadata:
            name: disallow-image-latest
          spec:
            validationFailureAction: Enforce
            rules:
              - name: image-tag
                match:
                  any:
                    - resources:
                        kinds: [Pod]
                validate:
                  message: "Images must not use the latest tag."
                  foreach:
                    - list: "request.object.spec.containers[]"
                      pattern:
                        image: "!*:latest"
          EOF

          # 3. Create all 6 compliant Kubernetes resources
          cat > resources.yaml <<'EOF'
          apiVersion: v1
          kind: Pod
          metadata:
            name: secure-pod
            labels:
              owner: platform
          spec:
            containers:
              - name: app
                image: nginx:1.27
                securityContext:
                  privileged: false
          ---
          apiVersion: apps/v1
          kind: Deployment
          metadata:
            name: secure-deployment
            labels:
              owner: platform
          spec:
            replicas: 1
            selector:
              matchLabels:
                app: secure-deploy
            template:
              metadata:
                labels:
                  app: secure-deploy
                  owner: platform
              spec:
                containers:
                  - name: app
                    image: nginx:1.27
                    securityContext:
                      privileged: false
          ---
          apiVersion: apps/v1
          kind: StatefulSet
          metadata:
            name: secure-statefulset
            labels:
              owner: platform
          spec:
            serviceName: "secure-service"
            replicas: 1
            selector:
              matchLabels:
                app: secure-sts
            template:
              metadata:
                labels:
                  app: secure-sts
                  owner: platform
              spec:
                containers:
                  - name: app
                    image: nginx:1.27
                    securityContext:
                      privileged: false
          ---
          apiVersion: apps/v1
          kind: DaemonSet
          metadata:
            name: secure-daemonset
            labels:
              owner: platform
          spec:
            selector:
              matchLabels:
                app: secure-ds
            template:
              metadata:
                labels:
                  app: secure-ds
                  owner: platform
              spec:
                containers:
                  - name: app
                    image: nginx:1.27
                    securityContext:
                      privileged: false
          ---
          apiVersion: batch/v1
          kind: Job
          metadata:
            name: secure-job
            labels:
              owner: platform
          spec:
            template:
              metadata:
                labels:
                  owner: platform
              spec:
                restartPolicy: Never
                containers:
                  - name: app
                    image: nginx:1.27
                    securityContext:
                      privileged: false
          ---
          apiVersion: batch/v1
          kind: CronJob
          metadata:
            name: secure-cronjob
            labels:
              owner: platform
          spec:
            schedule: "*/5 * * * *"
            jobTemplate:
              spec:
                template:
                  metadata:
                    labels:
                      owner: platform
                  spec:
                    restartPolicy: Never
                    containers:
                      - name: app
                        image: nginx:1.27
                        securityContext:
                          privileged: false
          EOF

          # 4. Create the Kyverno Test Suite definition
          cat > kyverno-test.yaml <<'EOF'
          name: security-test-suite
          policies:
            - policies.yaml
          resources:
            - resources.yaml
          results:
            - policy: disallow-privileged
              rule: privileged-containers
              resource: secure-pod
              kind: Pod
              result: pass
            - policy: require-owner-label
              rule: owner-label
              resource: secure-pod
              kind: Pod
              result: pass
            - policy: disallow-image-latest
              rule: image-tag
              resource: secure-pod
              kind: Pod
              result: pass
            - policy: disallow-privileged
              rule: autogen-privileged-containers
              resource: secure-deployment
              kind: Deployment
              result: pass
            - policy: require-owner-label
              rule: autogen-owner-label
              resource: secure-deployment
              kind: Deployment
              result: pass
            - policy: disallow-image-latest
              rule: autogen-image-tag
              resource: secure-deployment
              kind: Deployment
              result: pass
            - policy: disallow-privileged
              rule: autogen-privileged-containers
              resource: secure-statefulset
              kind: StatefulSet
              result: pass
            - policy: require-owner-label
              rule: autogen-owner-label
              resource: secure-statefulset
              kind: StatefulSet
              result: pass
            - policy: disallow-image-latest
              rule: autogen-image-tag
              resource: secure-statefulset
              kind: StatefulSet
              result: pass
            - policy: disallow-privileged
              rule: autogen-privileged-containers
              resource: secure-daemonset
              kind: DaemonSet
              result: pass
            - policy: require-owner-label
              rule: autogen-owner-label
              resource: secure-daemonset
              kind: DaemonSet
              result: pass
            - policy: disallow-image-latest
              rule: autogen-image-tag
              resource: secure-daemonset
              kind: DaemonSet
              result: pass
            - policy: disallow-privileged
              rule: autogen-privileged-containers
              resource: secure-job
              kind: Job
              result: pass
            - policy: require-owner-label
              rule: autogen-owner-label
              resource: secure-job
              kind: Job
              result: pass
            - policy: disallow-image-latest
              rule: autogen-image-tag
              resource: secure-job
              kind: Job
              result: pass
            - policy: disallow-privileged
              rule: autogen-cronjob-privileged-containers
              resource: secure-cronjob
              kind: CronJob
              result: pass
            - policy: require-owner-label
              rule: autogen-cronjob-owner-label
              resource: secure-cronjob
              kind: CronJob
              result: pass
            - policy: disallow-image-latest
              rule: autogen-cronjob-image-tag
              resource: secure-cronjob
              kind: CronJob
              result: pass
          EOF

          # 5. Run the test suite (18 passes, 0 skips)
          kyverno test .

          # 6. Sign and verify using Cosign
          printf 'All 6 workloads passed all Kyverno policies on commit %s\n' "$GITHUB_SHA" > security-result.txt
          cosign sign-blob --yes --bundle security-result.bundle security-result.txt
          cosign verify-blob \
            --bundle security-result.bundle \
            --certificate-identity-regexp "^https://github.com/${{ github.repository }}/" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            security-result.txt
