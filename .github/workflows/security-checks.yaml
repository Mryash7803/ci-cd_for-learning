name: Kyverno and Cosign Security Checks

on:
  push:
  pull_request:

permissions:
  contents: read
  id-token: write # Required for Cosign keyless signing via OIDC

jobs:
  policy-and-signature-checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Kyverno CLI
        uses: kyverno/action-install-cli@v0.2.0

      - name: Install Cosign
        uses: sigstore/cosign-installer@v3.7.0

      - name: Create Kyverno policies and test resources
        shell: bash
        run: |
          mkdir -p security
          cat > security/policies.yaml <<'EOF'
          apiVersion: kyverno.io/v1
          kind: ClusterPolicy
          metadata:
            name: disallow-privileged
          spec:
            validationFailureAction: Enforce
            rules:
              - name: privileged-containers
                match:
                  any:
                    - resources:
                        kinds: [Pod]
                validate:
                  message: "Privileged containers are not allowed."
                  pattern:
                    spec:
                      containers:
                        - =(securityContext):
                            =(privileged): false
          ---
          apiVersion: kyverno.io/v1
          kind: ClusterPolicy
          metadata:
            name: require-owner-label
          spec:
            validationFailureAction: Enforce
            rules:
              - name: owner-label
                match:
                  any:
                    - resources:
                        kinds: [Pod]
                validate:
                  message: "The owner label is required."
                  pattern:
                    metadata:
                      labels:
                        owner: "?*"
          ---
          apiVersion: kyverno.io/v1
          kind: ClusterPolicy
          metadata:
            name: disallow-image-latest
          spec:
            validationFailureAction: Enforce
            rules:
              - name: image-tag
                match:
                  any:
                    - resources:
                        kinds: [Pod]
                validate:
                  message: "Images must not use the latest tag."
                  foreach:
                    - list: "request.object.spec.containers[]"
                      pattern:
                        image: "!*:latest"
          EOF

          cat > security/resources.yaml <<'EOF'
          apiVersion: v1
          kind: Pod
          metadata:
            name: secure-pod
            labels:
              owner: platform
            namespace: default
          spec:
            containers:
              - name: app
                image: nginx:1.27
                securityContext:
                  privileged: false
          ---
          apiVersion: apps/v1
          kind: Deployment
          metadata:
            name: secure-deployment
            labels:
              owner: platform
            namespace: default
          spec:
            replicas: 1
            selector:
              matchLabels:
                app: secure-deploy
              labels:
                owner: platform
            template:
              metadata:
                labels:
                  app: secure-deploy
                  owner: platform
              spec:
                containers:
                  - name: app
                    image: nginx:1.27
                    securityContext:
                      privileged: false
          ---
          apiVersion: apps/v1
          kind: StatefulSet
          metadata:
            name: secure-statefulset
            labels:
              owner: platform
            namespace: default
          spec:
            serviceName: "secure-service"
            replicas: 1
            selector:
              matchLabels:
                app: secure-sts
              labels:
                owner: platform
            template:
              metadata:
                labels:
                  app: secure-sts
                  owner: platform
              spec:
                containers:
                  - name: app
                    image: nginx:1.27
                    securityContext:
                      privileged: false
          ---
          apiVersion: apps/v1
          kind: DaemonSet
          metadata:
            name: secure-daemonset
            labels:
              owner: platform
            namespace: default
          spec:
            selector:
              matchLabels:
                app: secure-ds
              labels:
                owner: platform
            template:
              metadata:
                labels:
                  app: secure-ds
                  owner: platform
              spec:
                containers:
                  - name: app
                    image: nginx:1.27
                    securityContext:
                      privileged: false
          ---
          apiVersion: batch/v1
          kind: Job
          metadata:
            name: secure-job
            labels:
              owner: platform
            namespace: default
          spec:
            template:
              metadata:
                labels:
                  owner: platform
              spec:
                restartPolicy: Never
                containers:
                  - name: app
                    image: nginx:1.27
                    securityContext:
                      privileged: false
          ---
          apiVersion: batch/v1
          kind: CronJob
          metadata:
            name: secure-cronjob
            labels:
              owner: platform
            namespace: default
          spec:
            schedule: "*/5 * * * *"
            jobTemplate:
              spec:
                template:
                  metadata:
                    labels:
                      owner: platform
                  spec:
                    restartPolicy: Never
                    containers:
                      - name: app
                        image: nginx:1.27
                        securityContext:
                          privileged: false
          EOF

      - name: Test Kyverno policies against all resources
        run: |
          kyverno apply security/policies.yaml --resource security/resources.yaml

      - name: Sign and verify attestation with Cosign
        env:
          COSIGN_YES: "true"
        run: |
          printf 'Kyverno policy checks passed for commit %s\n' "$GITHUB_SHA" > security-result.txt

          # Sign the result blob generating a Sigstore bundle
          cosign sign-blob --yes --bundle security-result.bundle security-result.txt

          # Verify the bundle against the GitHub OIDC identity
          cosign verify-blob \
            --bundle security-result.bundle \
            --certificate-identity-regexp "^https://github.com/${{ github.repository }}/" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            security-result.txt
