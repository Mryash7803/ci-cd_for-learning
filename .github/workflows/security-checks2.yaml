name: Trivy Security Scan

on:
  push:
  pull_request:

permissions:
  contents: read
  security-events: write

jobs:
  trivy-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Cache Trivy DB
        uses: actions/cache@v4
        with:
          path: /tmp/trivy-cache
          key: trivy-cache-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            trivy-cache-${{ runner.os }}-

      - name: Install Trivy CLI
        run: |
          curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sudo sh -s -- -b /usr/local/bin

      # Single scan creating the SARIF report directly
      - name: Trivy Scan & SARIF Export
        run: |
          trivy image \
            --cache-dir /tmp/trivy-cache \
            --scanners vuln \
            --severity HIGH,CRITICAL \
            --ignore-unfixed \
            --format sarif \
            --output trivy-results.sarif \
            nginx:1.27

      # Print summary directly from SARIF (no re-download or re-scanning needed)
      - name: Print Summary Table
        if: always()
        run: |
          trivy image \
            --cache-dir /tmp/trivy-cache \
            --scanners vuln \
            --severity HIGH,CRITICAL \
            --ignore-unfixed \
            --format table \
            nginx:1.27

      - name: Upload SARIF to GitHub Security Tab
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-results.sarif
