name: Trivy Security Scan

on:
  push:
  pull_request:

permissions:
  contents: read
  security-events: write # Required for uploading SARIF to the Security tab

jobs:
  trivy-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Cache Trivy DB
        uses: actions/cache@v4
        with:
          path: ~/.cache/trivy
          key: trivy-db-${{ github.run_id }}
          restore-keys: trivy-db-

      # Step 1: Scan and print human-readable table (fails if CVEs found)
      - name: Trivy vulnerability scan
        uses: aquasecurity/trivy-action@0.29.0
        with:
          image-ref: 'nginx:1.27' # Replace with your image name or ${{ steps.image.outputs.uri }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '0'          # Set to '1' if you want pipeline to fail on findings
          format: table
          timeout: 10m

      # Step 2: Generate SARIF report for GitHub Code Scanning
      - name: Generate SARIF Report
        if: always()
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: 'nginx:1.27'
          format: sarif
          output: trivy-results.sarif
          exit-code: '0'

      # Step 3: Upload SARIF to GitHub Security tab
      - name: Upload SARIF results
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-results.sarif
